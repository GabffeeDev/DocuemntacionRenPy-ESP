site_name: Docuemntación Ren'py Español
site_description: Documentación de Ren'Py en Español

theme:
  name: material
  language: es
  logo: assets/renpy-logo.png
  favicon: assets/renpy.ico

  features:
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.highlight
    - search.suggest

  palette:
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Modo claro

    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Modo oscuro

extra_css:
  - stylesheets/extra.css

nav:
  - Bienvenida: index.md
  - Inicio Rápido: Inicio rápido.md
